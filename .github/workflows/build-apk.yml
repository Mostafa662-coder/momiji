      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: NDK and CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: nanopb Python deps
        run: pip install protobuf grpcio-tools

      - name: Build APK (debug-signed, installs directly)
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleFdroidDebug

      - uses: actions/upload-artifact@v4
        with:
          name: momiji-translator-apk
          path: android/app/build/outputs/apk/fdroid/debug/*.apk
